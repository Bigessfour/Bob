# bob-v4.8-tight-prior — ~4000 episodes; shrink residual band + stronger solver-match reward.
# Init from bob-v4.7-test-4k (13 obs). C#: ResidualMaxMagnitude 1.0, IdealSolverMatch 0.35.
#
# Launch:
#   RUN_ID=bob-v4.8-tight-prior CONFIG=config/bob_free_throw_probe_4k_v48_tight.yaml \
#     ./scripts/train.sh --initialize-from=bob-v4.7-test-4k
# Unity: Default, recorder off, Play ONCE. Keep Game view visible (avoid display sleep → dark screen).

behaviors:
  Bob:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 3.0e-3
      beta_schedule: linear
      epsilon: 0.15
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Assets/Demos/bobfreethrow.demo
      strength: 0.6
      steps: 80000
    keep_checkpoints: 5
    max_steps: 380000
    time_horizon: 64
    summary_freq: 5000

environment_parameters:
  distance_scale: 1.0

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: bob-v0
  initialize_from: null
  load_model: false
  resume: false
  force: false

torch_settings:
  device: null

debug: false
