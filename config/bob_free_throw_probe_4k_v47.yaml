# bob-v4.7-curriculum — ~4000 episodes, P0–P2 method upgrade.
# Fresh policy (--force). Bob stays at FT line; hoop moves closer via distance_scale.
# Make-hunt BC demos (bobfreethrow.demo) required — not solver-near-miss auto batches.
#
# Launch:
#   RUN_ID=bob-v4.7-curriculum CONFIG=config/bob_free_throw_probe_4k_v47.yaml \
#     ./scripts/train.sh --force
# Unity: BehaviorType Default, recorder off, Play ONCE after listen.

behaviors:
  Bob:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Assets/Demos/bobfreethrow.demo
      strength: 0.8
      steps: 100000
    keep_checkpoints: 5
    max_steps: 380000
    time_horizon: 64
    summary_freq: 5000

environment_parameters:
  distance_scale:
    curriculum:
      - name: CloseRange
        completion_criteria:
          measure: progress
          behavior: Bob
          signal_smoothing: true
          min_lesson_length: 400
          threshold: 0.12
        value: 0.65
      - name: MidRange
        completion_criteria:
          measure: progress
          behavior: Bob
          signal_smoothing: true
          min_lesson_length: 400
          threshold: 0.10
        value: 0.80
      - name: Regulation
        value: 1.0

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: bob-v0
  initialize_from: null
  load_model: false
  resume: false
  force: false

torch_settings:
  device: null

debug: false
