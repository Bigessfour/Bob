# bob-v4.7-ext — extend v4.7 toward demo-done (70% / last 1k).
# Init from bob-v4.7-curriculum (13 obs, same C#). Regulation distance only.
# No new demo recording required — reuse bobfreethrow.demo for light BC regularization.
#
# Launch:
#   RUN_ID=bob-v4.7-ext CONFIG=config/bob_free_throw_probe_v47_ext.yaml \
#     ./scripts/train.sh --initialize-from=bob-v4.7-curriculum
# Unity: BehaviorType Default, DemonstrationRecorder.Record=false, Play ONCE after listen.

behaviors:
  Bob:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Assets/Demos/bobfreethrow.demo
      strength: 0.4
      steps: 50000
    keep_checkpoints: 5
    # ~7600 episodes @ ~100 steps/ep (regulation FT)
    max_steps: 760000
    time_horizon: 64
    summary_freq: 5000

environment_parameters:
  distance_scale: 1.0

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: bob-v0
  initialize_from: null
  load_model: false
  resume: false
  force: false

torch_settings:
  device: null

debug: false
