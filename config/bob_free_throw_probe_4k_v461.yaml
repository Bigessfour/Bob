# bob-v4.6.1 probe — ~4000 episodes, anti-farming reward pass, 40× sim (2× v4.6-residual).
# Init from bob-v4.6-residual (11 obs + residual hybrid); reward constants in C# changed.
#
# Launch:
#   RUN_ID=bob-v4.6.1 CONFIG=config/bob_free_throw_probe_4k_v461.yaml \
#     ./scripts/train.sh --initialize-from=bob-v4.6-residual
# Unity: BehaviorType Default, recorder off, Play ONCE after listen.

behaviors:
  Bob:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Assets/Demos/bobfreethrow.demo
      strength: 0.5
      steps: 120000
    keep_checkpoints: 5
    # 4000 episodes × ~93 steps/episode ≈ 372000; 380000 ≈ ~4086 eps headroom
    max_steps: 380000
    time_horizon: 64
    summary_freq: 5000

environment_parameters: {}

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 40
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: bob-v0
  initialize_from: null
  load_model: false
  resume: false
  force: false

torch_settings:
  device: null

debug: false
