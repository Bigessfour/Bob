# Tier 2 — PPO + behavioral cloning.
# Prerequisites:
#   1. Bob → Demo → Enable Demonstration Recorder
#   2. Play; record ~30–50 heuristic free throws → Assets/Demos/bob_free_throw.demo
#   3. Bob → Demo → Disable Demonstration Recorder (restore Default)
#   4. CONFIG=config/bob_free_throw_bc.yaml RUN_ID=bob-v4.2 ./scripts/train.sh --force
#
# Default training still uses config/bob_free_throw.yaml (no BC).

behaviors:
  Bob:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Assets/Demos/bob_free_throw.demo
      strength: 0.5
      steps: 100000
    keep_checkpoints: 5
    max_steps: 500000
    time_horizon: 64
    summary_freq: 5000

environment_parameters: {}

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: bob-v0
  initialize_from: null
  load_model: false
  resume: false
  force: false

torch_settings:
  device: null

debug: false
