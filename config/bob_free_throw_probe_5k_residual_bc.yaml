# bob-v4.6-residual probe — ~5000 episodes + BC from residual c≈0 demos.
# Demos: Bob → Demo → Enable Demonstration Recorder (HeuristicOnly, auto-fire c=0).
# Fresh policy (--force); do NOT initialize from absolute-impulse bob-v4.x checkpoints.
#
# Launch:
#   RUN_ID=bob-v4.6-residual CONFIG=config/bob_free_throw_probe_5k_residual_bc.yaml \
#     ./scripts/train.sh --force
# Unity: BehaviorType Default, DemonstrationRecorder.Record=false, Play ONCE after listen.

behaviors:
  Bob:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Assets/Demos/bobfreethrow.demo
      strength: 0.5
      steps: 150000
    keep_checkpoints: 5
    max_steps: 475000
    time_horizon: 64
    summary_freq: 5000

environment_parameters: {}

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

checkpoint_settings:
  run_id: bob-v0
  initialize_from: null
  load_model: false
  resume: false
  force: false

torch_settings:
  device: null

debug: false
